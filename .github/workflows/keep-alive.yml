name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 10 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s "${{ secrets.SUPA_URL }}/rest/v1/operacoes?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPA_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPA_KEY }}"
          echo "Ping OK"
